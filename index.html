<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --border: color-mix(in srgb, var(--hint) 25%, transparent);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, .page, header, .product, .gallery, .cart-item, button, .tab, .cat-btn {
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    input, textarea {
      -webkit-user-select: text !important; user-select: text !important; -webkit-touch-callout: default !important;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding-bottom: 140px; line-height: 1.4;
    }
    img { -webkit-user-drag: none; display: block; }
    header {
      position: sticky; top: 0; z-index: 100; background: var(--secondary);
      padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    body.product-open header { display: none; }
    header h1 { font-size: 18px; font-weight: 700; white-space: nowrap; }
    .tabs { display: flex; gap: 6px; flex-shrink: 0; }
    .tab {
      padding: 8px 14px; border-radius: 20px; background: transparent;
      border: 1px solid var(--border); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .tab.active { background: var(--button); color: var(--button-text); border-color: var(--button); }
    .filters { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .search-box {
      width: 100%; padding: 12px 16px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; outline: none;
    }
    .categories { display: flex; gap: 8px; overflow-x: auto; }
    .cat-btn {
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active { background: var(--button); color: var(--button-text); border-color: var(--button); }
    .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 0 16px 16px; }
    .product {
      background: var(--secondary); border-radius: 18px; overflow: hidden;
      display: flex; flex-direction: column; cursor: pointer;
    }
    .product-img-wrap { width: 100%; height: 150px; background: #d1d1d6; overflow: hidden; }
    .product-img-wrap img { width: 100%; height: 150px; object-fit: cover; }
    .product-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .product-name { font-weight: 600; font-size: 14px; }
    .product-price { color: var(--button); font-weight: 700; font-size: 16px; }
    .product-stock { font-size: 12px; color: var(--hint); font-weight: 500; }
    .product-stock.out { color: #ff9500; }
    .add-btn {
      margin-top: 8px; background: var(--button); color: var(--button-text);
      border: none; padding: 11px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .support-bottom {
      margin: 8px 16px 24px; width: calc(100% - 32px); padding: 14px; border-radius: 14px;
      border: 1.5px solid var(--border); background: transparent; color: var(--text);
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .gallery { position: relative; width: 100%; height: 320px; overflow: hidden; background: #d1d1d6; }
    .gallery-track { display: flex; height: 100%; transition: transform 0.3s ease; }
    .gallery-slide { min-width: 100%; height: 100%; }
    .gallery-slide img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-dots {
      position: absolute; bottom: 12px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px;
    }
    .gallery-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
    .gallery-dots span.active { background: white; }
    .back-icon {
      position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 200;
      width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45);
      color: white; display: none; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    body.product-open .back-icon { display: flex; }
    .back-icon svg { width: 22px; height: 22px; fill: white; }
    .cart-fab {
      position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 200;
      width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45);
      color: white; display: none; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    body.product-open .cart-fab { display: flex; }
    .cart-fab svg { width: 22px; height: 22px; fill: white; }
    .cart-fab-badge {
      position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px;
      padding: 0 4px; border-radius: 9px; background: #ff3b30; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; display: none;
    }
    .cart-fab-badge.show { display: block; }
    .detail-content { padding: 20px 16px; }
    .detail-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--button); margin-bottom: 8px; }
    .detail-stock { font-size: 14px; color: var(--hint); margin-bottom: 16px; font-weight: 500; }
    .detail-stock.out { color: #ff9500; }
    .detail-desc { font-size: 15px; line-height: 1.5; margin-bottom: 20px; white-space: pre-wrap; }
    .detail-actions { display: flex; flex-direction: column; gap: 10px; }
    .detail-add-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: var(--button); color: var(--button-text); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .share-btn {
      width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border);
      background: transparent; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .cart-top { display: flex; justify-content: flex-end; padding: 12px 16px 0; }
    .clear-cart-btn {
      border: none; background: transparent; color: #ff3b30;
      font-size: 14px; font-weight: 600; cursor: pointer; padding: 8px 4px;
    }
    .cart-item {
      display: flex; gap: 14px; padding: 16px;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .cart-item img { width: 70px; height: 70px; object-fit: cover; border-radius: 14px; background: #d1d1d6; }
    .cart-info { flex: 1; min-width: 0; }
    .cart-info .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .cart-info .price { color: var(--button); font-weight: 600; }
    .cart-info .made-note { font-size: 12px; color: #ff9500; margin-top: 4px; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--button); color: white; font-size: 18px; cursor: pointer;
    }
    .delivery-block { padding: 16px; border-top: 1px solid var(--border); }
    .delivery-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .delivery-option {
      display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px;
      border: 1.5px solid var(--border); margin-bottom: 10px; cursor: pointer;
    }
    .delivery-option.active {
      border-color: var(--button);
      background: color-mix(in srgb, var(--button) 8%, transparent);
    }
    .delivery-option input { accent-color: var(--button); width: 18px; height: 18px; }
    .delivery-option .text { flex: 1; font-size: 14px; }
    .delivery-option .price-tag { font-weight: 600; color: var(--button); font-size: 14px; }
    .ozon-fields { margin-top: 14px; display: none; flex-direction: column; gap: 12px; }
    .ozon-fields.show { display: flex; }
    .ozon-fields .note {
      font-size: 13px; color: var(--hint); line-height: 1.45;
      background: color-mix(in srgb, var(--button) 8%, transparent);
      padding: 12px 14px; border-radius: 12px;
    }
    .ozon-fields input {
      width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 15px; outline: none;
    }
    .map-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #fc3f1d, #ff6b4a); color: white;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .map-btn svg { width: 20px; height: 20px; fill: white; }
    .promo-block { padding: 0 16px 16px; display: none; flex-direction: column; gap: 8px; }
    .promo-block.show { display: flex; }
    .promo-row { display: flex; gap: 8px; }
    .promo-row input {
      flex: 1; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px; outline: none;
    }
    .promo-row button {
      padding: 12px 16px; border-radius: 12px; border: none;
      background: var(--button); color: var(--button-text); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .promo-status { font-size: 13px; color: var(--hint); min-height: 18px; }
    .promo-status.ok { color: #34c759; }
    .promo-status.err { color: #ff3b30; }
    .total-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--secondary); padding: 16px;
      display: none; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08); z-index: 50; border-top: 1px solid var(--border);
    }
    .total-bar .label { font-size: 13px; color: var(--hint); }
    .total-bar .amount { font-size: 22px; font-weight: 700; }
    .checkout-btn {
      background: var(--button); color: var(--button-text); border: none;
      padding: 14px 26px; border-radius: 14px; font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .checkout-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty { text-align: center; padding: 90px 24px; color: var(--hint); font-size: 16px; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
  <header>
    <h1 id="page-title">Витрина</h1>
    <div class="tabs" id="main-tabs">
      <button class="tab active" data-page="catalog" type="button">Товары</button>
      <button class="tab" data-page="cart" type="button">Корзина <span id="cart-count"></span></button>
    </div>
  </header>
  <button class="back-icon" id="back-btn" type="button" aria-label="Назад">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>
  <button class="cart-fab" id="cart-fab" type="button" aria-label="Корзина">
    <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    <span class="cart-fab-badge" id="cart-fab-badge">0</span>
  </button>
  <div id="catalog" class="page active">
    <div class="filters">
      <input type="text" class="search-box" id="search-input" placeholder="Поиск по названию...">
      <div class="categories">
        <button class="cat-btn active" data-category="all" type="button">Все</button>
        <button class="cat-btn" data-category="busts" type="button">Бюсты</button>
        <button class="cat-btn" data-category="figures" type="button">Фигурки</button>
      </div>
    </div>
    <div class="products" id="products-list"></div>
    <button class="support-bottom" id="support-btn" type="button">Написать в поддержку</button>
  </div>
  <div id="product-page" class="page">
    <div class="product-detail">
      <div class="gallery">
        <div class="gallery-track" id="gallery-track"></div>
        <div class="gallery-dots" id="gallery-dots"></div>
      </div>
      <div class="detail-content">
        <div class="detail-name" id="detail-name"></div>
        <div class="detail-price" id="detail-price"></div>
        <div class="detail-stock" id="detail-stock"></div>
        <div class="detail-desc" id="detail-desc"></div>
        <div class="detail-actions">
          <button class="detail-add-btn" id="detail-add-btn" type="button">В корзину</button>
          <button class="share-btn" id="share-btn" type="button">Поделиться</button>
        </div>
      </div>
    </div>
  </div>
  <div id="cart" class="page">
    <div class="cart-top" id="cart-top" style="display:none;">
      <button class="clear-cart-btn" id="clear-cart-btn" type="button">Очистить корзину</button>
    </div>
    <div id="cart-list"></div>
    <div class="promo-block" id="promo-block">
      <div class="promo-row">
        <input type="text" id="promo-input" placeholder="Промокод">
        <button type="button" id="promo-apply">Применить</button>
      </div>
      <div class="promo-status" id="promo-status"></div>
    </div>
    <div class="delivery-block" id="delivery-block" style="display:none;">
      <div class="delivery-title">Способ получения</div>
      <label class="delivery-option" id="opt-ozon">
        <input type="radio" name="delivery" value="ozon">
        <div class="text">Доставка до пункта Ozon</div>
        <div class="price-tag">+500 ₽</div>
      </label>
      <label class="delivery-option" id="opt-pickup">
        <input type="radio" name="delivery" value="pickup">
        <div class="text">Самовывоз по г. Москва</div>
        <div class="price-tag">Бесплатно</div>
      </label>
      <div class="ozon-fields" id="ozon-fields">
        <div class="note">
          Обязательная информация для оформления заказа на Ozon.<br>
          Найдите пункт на карте, скопируйте адрес, затем зажмите поле и выберите «Вставить».
        </div>
        <button class="map-btn" id="open-map-btn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Найти пункт на карте
        </button>
        <input type="text" id="recipient-name" placeholder="Имя получателя *">
        <input type="tel" id="recipient-phone" placeholder="Номер телефона *">
        <input type="text" id="ozon-address" placeholder="Адрес пункта выдачи Ozon *" autocomplete="street-address">
      </div>
    </div>
    <div class="total-bar" id="cart-total">
      <div>
        <div class="label">Итого</div>
        <div class="amount" id="total-price">0 ₽</div>
      </div>
      <button class="checkout-btn" id="checkout-btn" disabled type="button">Оплатить</button>
    </div>
  </div>

          }
          setTimeout(function () {
            try { tg.HapticFeedback.notificationOccurred('success'); } catch (e3) {}
          }, 30);
        }
      } catch (e) {}
      try { if (navigator.vibrate) navigator.vibrate([40, 30, 40]); } catch (e) {}
    }

    async function syncFromServer() {
      try {
        var res = await fetch(API_URL + '/products');
        var data = await res.json();
        if (!data.ok || !data.products || !data.products.length) return;
        for (var i = 0; i < data.products.length; i++) {
          var server = data.products[i];
          var local = products.find(function (p) {
            return Number(p.id) === Number(server.id);
          });
          if (local) {
            if (server.price != null) local.price = Number(server.price);
            if (server.stock != null) local.stock = Number(server.stock);
            if (server.name) local.name = server.name;
          }
        }
        cart = cart.map(function (item) {
          var p = products.find(function (x) { return x.id === item.id; });
          if (p) {
            item.price = p.price;
            item.name = p.name;
            item.photo = p.photos[0];
          }
          return item;
        }).filter(function (item) {
          return products.some(function (p) { return p.id === item.id; });
        });
        localStorage.setItem('shop_cart', JSON.stringify(cart));
      } catch (e) {}
    }

    function getFilteredProducts() {
      return products.filter(function (p) {
        var matchCategory = currentCategory === 'all' || p.category === currentCategory;
        var matchSearch = !searchQuery || p.name.toLowerCase().indexOf(searchQuery) !== -1;
        return matchCategory && matchSearch;
      });
    }
    function renderProducts() {
      var list = document.getElementById('products-list');
      var filtered = getFilteredProducts();
      if (!filtered.length) { list.innerHTML = '<div class="empty">Ничего не найдено</div>'; return; }
      var html = '';
      for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        var s = stockLabel(p.stock);
        var stockClass = s.out ? 'product-stock out' : 'product-stock';
        html += '<div class="product" data-id="' + p.id + '">';
        html += '<div class="product-img-wrap"><img src="' + p.photos[0] + '" alt=""></div>';
        html += '<div class="product-info">';
        html += '<div class="product-name">' + p.name + '</div>';
        html += '<div class="product-price">' + p.price.toLocaleString('ru-RU') + ' ₽</div>';
        html += '<div class="' + stockClass + '">' + s.text + '</div>';
        html += '<button class="add-btn" data-id="' + p.id + '" type="button">В корзину</button>';
        html += '</div></div>';
      }
      list.innerHTML = html;

    function doAddToCart(product) {
      var existing = cart.find(function (item) { return item.id === product.id; });
      if (existing) existing.qty += 1;
      else cart.push({
        id: product.id, name: product.name, price: product.price, qty: 1, photo: product.photos[0]
      });
      saveCart();
      updateCartFabBadge();
      hapticSuccess();
    }
    function addToCart(id) {
      var product = products.find(function (p) { return p.id === id; });
      if (!product) return;
      var existing = cart.find(function (item) { return item.id === id; });
      var nextQty = (existing ? existing.qty : 0) + 1;
      if (needsMakeTime(id, nextQty)) {
        if (tg.showPopup) {
          tg.showPopup({
            title: '⚠️ Под заказ',
            message: MAKE_TIME_MSG,
            buttons: [
              { id: 'cancel', type: 'cancel' },
              { id: 'ok', type: 'default', text: 'В корзину' }
            ]
          }, function (btnId) {
            if (btnId === 'ok' || btnId === 'default') doAddToCart(product);
          });
        } else doAddToCart(product);
        return;
      }
      doAddToCart(product);
    }
    function changeQty(id, delta) {
      var item = cart.find(function (i) { return i.id === id; });
      if (!item) return;
      if (delta > 0 && needsMakeTime(id, item.qty + 1)) {
        if (tg.showPopup) {
          tg.showPopup({
            title: '⚠️ Под заказ',
            message: MAKE_TIME_MSG,
            buttons: [
              { id: 'cancel', type: 'cancel' },
              { id: 'ok', type: 'default', text: 'Добавить' }
            ]
          }, function (btnId) {
            if (btnId === 'ok' || btnId === 'default') {
              item.qty += 1; saveCart(); hapticLight(); renderCart(); updateCartFabBadge();
            }
          });
        } else {
          item.qty += 1; saveCart(); hapticLight(); renderCart(); updateCartFabBadge();
        }
        return;
      }
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(function (i) { return i.id !== id; });
      saveCart(); hapticLight(); renderCart(); updateCartFabBadge();
    }

    document.getElementById('opt-pickup').addEventListener('click', function () {
      deliveryMethod = 'pickup'; document.querySelector('input[value="pickup"]').checked = true; updateDeliveryUI();
    });
    document.getElementById('open-map-btn').addEventListener('click', function () {
      var url = 'https://yandex.ru/maps/?text=' + encodeURIComponent('пункт выдачи Ozon');
      if (tg.openLink) tg.openLink(url); else window.open(url, '_blank');
    });

    document.getElementById('promo-apply').addEventListener('click', async function () {
      var input = document.getElementById('promo-input');
      var status = document.getElementById('promo-status');
      var code = input.value.trim();
      if (!code) {
        status.textContent = 'Введите промокод';
        status.className = 'promo-status err';
        appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
        updateTotal(); return;
      }
      if (code.toUpperCase() !== 'IAMCLOWN' && isPromoUsed()) {
        status.textContent = 'Промокод уже был использован';
        status.className = 'promo-status err';
        appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
        updateTotal(); return;
      }
      status.textContent = 'Проверка...';
      status.className = 'promo-status';
      try {
        var res = await fetch(API_URL + '/promo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code })
        });
        var data = await res.json();
        if (data.ok) {
          appliedPromo = true;
          appliedPromoCode = code.toUpperCase();
          appliedPromoPercent = Number(data.percent) || 0;
          var extra = data.left != null ? ' (осталось ' + data.left + ')' : '';
          status.textContent = 'Промокод применён: −' + appliedPromoPercent + '%' + extra;
          status.className = 'promo-status ok';
          hapticSuccess();
          updateTotal();
        } else if (data.error === 'limit') {
          appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
          status.textContent = 'Промокод исчерпан';
          status.className = 'promo-status err';
          updateTotal();
        } else {
          appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
          status.textContent = data.error === 'not_found' ? 'Промокод не найден' : 'Ошибка промокода';
          status.className = 'promo-status err';
          updateTotal();
        }
      } catch (e) {
        appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
        status.textContent = 'Не удалось проверить промокод';
        status.className = 'promo-status err';
        updateTotal();
      }
    });

    ['recipient-name', 'recipient-phone', 'ozon-address'].forEach(function (id) {
      document.getElementById(id).addEventListener('input', checkCheckoutReady);
    });
    function checkCheckoutReady() {
      var btn = document.getElementById('checkout-btn');
      if (!deliveryMethod) { btn.disabled = true; updateMainButton(); return; }
      if (deliveryMethod === 'ozon') {
        var name = document.getElementById('recipient-name').value.trim();
        var phone = document.getElementById('recipient-phone').value.trim();
        var address = document.getElementById('ozon-address').value.trim();
        btn.disabled = !(name.length >= 2 && phone.length >= 10 && address.length >= 5);
      } else btn.disabled = false;
      updateMainButton();
    }
    function getDeliveryPrice() { return deliveryMethod === 'ozon' ? DELIVERY_PRICE : 0; }
    function getDiscount(productsTotal) {
      if (!appliedPromo || !appliedPromoPercent) return 0;
      return Math.floor(productsTotal * appliedPromoPercent / 100);
    }
    function updateTotal() {
      var productsTotal = cart.reduce(function (sum, i) { return sum + i.price * i.qty; }, 0);
      var total = Math.max(0, productsTotal - getDiscount(productsTotal) + getDeliveryPrice());
      document.getElementById('total-price').textContent = total.toLocaleString('ru-RU') + ' ₽';
    }
    function renderCart() {
      var list = document.getElementById('cart-list');
      if (!cart.length) {
        list.innerHTML = '<div class="empty">Корзина пуста</div>';
        document.getElementById('cart-total').style.display = 'none';
        document.getElementById('delivery-block').style.display = 'none';
        document.getElementById('promo-block').classList.remove('show');
        document.getElementById('cart-top').style.display = 'none';
        updateMainButton(); updateBackButton(); return;
      }
      var html = '';
      for (var i = 0; i < cart.length; i++) {
        var item = cart[i];
        var p = products.find(function (x) { return x.id === item.id; });
        var make = p && item.qty > Number(p.stock);
        html += '<div class="cart-item"><img src="' + item.photo + '" alt="">';
        html += '<div class="cart-info"><div class="name">' + item.name + '</div>';
        html += '<div class="price">' + item.price.toLocaleString('ru-RU') + ' ₽</div>';
        if (make) html += '<div class="made-note">⚠️ Под заказ · 1–3 дня</div>';
        html += '</div><div class="qty">';
        html += '<button class="qty-btn" data-id="' + item.id + '" data-delta="-1" type="button">−</button>';
        html += '<span>' + item.qty + '</span>';
        html += '<button class="qty-btn" data-id="' + item.id + '" data-delta="1" type="button">+</button>';
        html += '</div></div>';
      }
      list.innerHTML = html;
      document.querySelectorAll('.qty-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          changeQty(Number(btn.dataset.id), Number(btn.dataset.delta));
        });
      });
      document.getElementById('cart-top').style.display = 'flex';
      document.getElementById('promo-block').classList.add('show');
      document.getElementById('delivery-block').style.display = 'block';
      document.getElementById('cart-total').style.display = 'flex';
      updateTotal(); checkCheckoutReady(); updateBackButton();
    }
    function updateCartCount() {
      var count = cart.reduce(function (s, i) { return s + i.qty; }, 0);
      document.getElementById('cart-count').textContent = count > 0 ? '(' + count + ')' : '';
      updateCartFabBadge();
    }
    function updateCartFabBadge() {
      var count = cart.reduce(function (s, i) { return s + i.qty; }, 0);
      var badge = document.getElementById('cart-fab-badge');
      badge.textContent = String(count);
      if (count > 0) badge.classList.add('show');
      else badge.classList.remove('show');
    }

    async function processOrder() {
      var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      var orderNumber = generateOrderNumber();
      var items = cart.map(function (item) {
        return { id: item.id, qty: item.qty };
      });
      try {
        var res = await fetch(API_URL + '/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            orderNumber: orderNumber,
            items: items,
            promoCode: appliedPromo ? appliedPromoCode : '',
            deliveryMethod: deliveryMethod,
            recipientName: document.getElementById('recipient-name').value.trim(),
            recipientPhone: document.getElementById('recipient-phone').value.trim(),
            recipientAddress: document.getElementById('ozon-address').value.trim(),
            user: user ? {
              id: user.id,
              first_name: user.first_name,
              last_name: user.last_name,
              username: user.username
            } : null
          })
        });
        return await res.json();
      } catch (e) {
        return { ok: false };
      }
    }

    document.getElementById('checkout-btn').addEventListener('click', async function () {
      if (!cart.length || !deliveryMethod) return;
      if (deliveryMethod === 'ozon') {
        var name = document.getElementById('recipient-name').value.trim();
        var phone = document.getElementById('recipient-phone').value.trim();
        var address = document.getElementById('ozon-address').value.trim();
        if (name.length < 2 || phone.length < 10 || address.length < 5) {
          tg.showAlert('Заполните все обязательные поля');
          return;
        }
      }
      if (appliedPromo && appliedPromoCode !== 'IAMCLOWN' && isPromoUsed()) {
        tg.showAlert('Промокод уже был использован');
        appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
        document.getElementById('promo-status').textContent = 'Промокод уже был использован';
        document.getElementById('promo-status').className = 'promo-status err';
        updateTotal();
        return;
      }

      var btn = document.getElementById('checkout-btn');
      btn.disabled = true;
      btn.textContent = 'Создаём оплату...';

      var result = await processOrder();
      btn.disabled = false;
      btn.textContent = 'Оплатить';

      if (result && result.ok && result.confirmationUrl) {
        if (Number(result.discount) > 0 && appliedPromoCode !== 'IAMCLOWN') {
          markPromoUsed();
        }
        hapticSuccess();

        cart = [];
        deliveryMethod = null;
        appliedPromo = false; appliedPromoCode = ''; appliedPromoPercent = 0;
        document.getElementById('promo-input').value = '';
        document.getElementById('promo-status').textContent = '';
        document.getElementById('promo-status').className = 'promo-status';
        document.getElementById('recipient-name').value = '';
        document.getElementById('recipient-phone').value = '';
        document.getElementById('ozon-address').value = '';
        document.querySelectorAll('input[name="delivery"]').forEach(function (r) { r.checked = false; });
        document.getElementById('ozon-fields').classList.remove('show');
        saveCart();
        renderCart();
        updateCartFabBadge();

        tg.showPopup({
          title: 'Переход к оплате',
          message: 'Заказ №' + result.orderNumber + '\nСумма: ' + Number(result.total).toLocaleString('ru-RU') + ' ₽\n\nОткроется страница ЮKassa.',
          buttons: [{ type: 'ok' }]
        }, function () {
          if (tg.openLink) tg.openLink(result.confirmationUrl);
          else window.open(result.confirmationUrl, '_blank');
        });
      } else {
        var msg = (result && (result.message || result.error)) || 'Не удалось создать оплату. Проверьте Worker и ЮKassa.';
        tg.showAlert(String(msg));
      }
    });

    document.body.classList.remove('product-open');
    document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('active'); });
    document.getElementById('catalog').classList.add('active');
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.remove('active'); });
    document.querySelector('.tab[data-page="catalog"]').classList.add('active');
    document.getElementById('main-tabs').style.display = 'flex';
    document.getElementById('page-title').textContent = 'Витрина';

    updateCartCount();
    updateMainButton();
    updateBackButton();
    updateCartFabBadge();

    syncFromServer().then(function () {
      renderProducts();
      openFromStartParam();
    });
  </script>
</body>
</html>
