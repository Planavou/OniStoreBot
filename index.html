<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --border: color-mix(in srgb, var(--hint) 25%, transparent);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
      line-height: 1.4;
    }
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--secondary);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .tabs { display: flex; gap: 6px; }
    .tab {
      padding: 8px 14px; border-radius: 20px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .tab.active {
      background: var(--button); color: var(--button-text); border-color: var(--button);
    }

    /* Поиск и категории */
    .filters {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .cat-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .cat-btn.active {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
    }

    .products {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 14px; padding: 0 16px 16px;
    }
    .product {
      background: var(--secondary); border-radius: 18px;
      overflow: hidden; display: flex; flex-direction: column;
      cursor: pointer;
    }
    .product img {
      width: 100%; height: 150px; object-fit: cover; background: #e5e5ea;
    }
    .product-info {
      padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px;
    }
    .product-name { font-weight: 600; font-size: 14px; }
    .product-price { color: var(--button); font-weight: 700; font-size: 16px; }
    .add-btn {
      margin-top: 8px; background: var(--button); color: var(--button-text);
      border: none; padding: 11px; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }

    /* Страница товара */
    .gallery {
      position: relative; width: 100%; height: 320px;
      overflow: hidden; background: #e5e5ea;
    }
    .gallery-track {
      display: flex; width: 200%; height: 100%;
      transition: transform 0.3s ease;
    }
    .gallery-track img {
      width: 50%; height: 100%; object-fit: cover; flex-shrink: 0;
    }
    .gallery-dots {
      position: absolute; bottom: 12px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px;
    }
    .gallery-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
    }
    .gallery-dots span.active { background: white; }
    .detail-content { padding: 20px 16px; }
    .detail-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--button); margin-bottom: 16px; }
    .detail-desc { font-size: 15px; line-height: 1.5; margin-bottom: 24px; white-space: pre-wrap; }
    .detail-actions { display: flex; gap: 10px; }
    .back-btn {
      flex: 1; padding: 14px; border-radius: 14px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .detail-add-btn {
      flex: 2; padding: 14px; border-radius: 14px; border: none;
      background: var(--button); color: var(--button-text);
      font-size: 15px; font-weight: 600; cursor: pointer;
    }

    /* Корзина */
    .cart-item {
      display: flex; gap: 14px; padding: 16px;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .cart-item img {
      width: 70px; height: 70px; object-fit: cover; border-radius: 14px;
    }
    .cart-info { flex: 1; min-width: 0; }
    .cart-info .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .cart-info .price { color: var(--button); font-weight: 600; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--button); color: white; font-size: 18px; cursor: pointer;
    }
    .total-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--secondary); padding: 16px;
      display: none; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08); z-index: 50;
      border-top: 1px solid var(--border);
    }
    .total-bar .label { font-size: 13px; color: var(--hint); }
    .total-bar .amount { font-size: 22px; font-weight: 700; }
    .checkout-btn {
      background: var(--button); color: var(--button-text);
      border: none; padding: 14px 26px; border-radius: 14px;
      font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .empty {
      text-align: center; padding: 90px 24px;
      color: var(--hint); font-size: 16px;
    }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">Витрина</h1>
    <div class="tabs" id="main-tabs">
      <button class="tab active" data-page="catalog">Товары</button>
      <button class="tab" data-page="cart">Корзина <span id="cart-count"></span></button>
    </div>
  </header>

  <!-- Витрина -->
  <div id="catalog" class="page active">
    <div class="filters">
      <input type="text" class="search-box" id="search-input" placeholder="Поиск по названию...">
      <div class="categories">
        <button class="cat-btn active" data-category="all">Все</button>
        <button class="cat-btn" data-category="busts">Бюсты</button>
        <button class="cat-btn" data-category="figures">Фигурки</button>
      </div>
    </div>
    <div class="products" id="products-list"></div>
  </div>

  <!-- Страница товара -->
  <div id="product-page" class="page">
    <div class="product-detail">
      <div class="gallery">
        <div class="gallery-track" id="gallery-track"></div>
        <div class="gallery-dots" id="gallery-dots"></div>
      </div>
      <div class="detail-content">
        <div class="detail-name" id="detail-name"></div>
        <div class="detail-price" id="detail-price"></div>
        <div class="detail-desc" id="detail-desc"></div>
        <div class="detail-actions">
          <button class="back-btn" id="back-btn">← Назад</button>
          <button class="detail-add-btn" id="detail-add-btn">В корзину</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Корзина -->
  <div id="cart" class="page">
    <div id="cart-list"></div>
    <div class="total-bar" id="cart-total">
      <div>
        <div class="label">Итого</div>
        <div class="amount" id="total-price">0 ₽</div>
      </div>
      <button class="checkout-btn" id="checkout-btn">Оформить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const BOT_TOKEN = '8591437038:AAG8PFhkCNZcMgmUycYGWALAjpAmhA65pqY';
    const ADMIN_CHAT_ID = '1232069518';

    let products = [
      {
        id: 1,
        name: "Бюст Паук-Нуар",
        price: 1,
        category: "busts",
        description: "Коллекционный бюст Паук-Нуар.\nВысокое качество исполнения.\nОтличный подарок для фанатов.",
        photos: [
          "https://getfile.dokpub.com/yandex/get/https://disk.yandex.ru/i/-unFhkzmvAHkTA",
          "https://getfile.dokpub.com/yandex/get/https://disk.yandex.ru/i/-unFhkzmvAHkTA"
        ]
      },
      {
        id: 2,
        name: "Фигурка Power",
        price: 1,
        category: "figures",
        description: "Коллекционная фигурка Power.\nДетализированная проработка.\nМатериал: ПВХ.",
        photos: [
          "https://github.com/Planavou/OniStoreBot/blob/64fe3490c05a4c669a23a640a0865c616d2606c9/IMG_20260903_160858_230.jpg",
          "https://via.placeholder.com/400x400?text=Power+2"
        ]
      }
    ];

    let cart = JSON.parse(localStorage.getItem('shop_cart') || '[]');
    let currentProduct = null;
    let currentSlide = 0;
    let currentCategory = 'all';
    let searchQuery = '';

    function saveCart() {
      localStorage.setItem('shop_cart', JSON.stringify(cart));
      updateCartCount();
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      const titles = { catalog: 'Витрина', cart: 'Корзина', 'product-page': 'Товар' };
      document.getElementById('page-title').textContent = titles[pageId] || 'Магазин';
      document.getElementById('main-tabs').style.display = pageId === 'product-page' ? 'none' : 'flex';
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showPage(btn.dataset.page);
        if (btn.dataset.page === 'catalog') renderProducts();
        if (btn.dataset.page === 'cart') renderCart();
      });
    });

    // Категории
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts();
      });
    });

    // Поиск
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderProducts();
    });

    function getFilteredProducts() {
      return products.filter(p => {
        const matchCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery);
        return matchCategory && matchSearch;
      });
    }

    function renderProducts() {
      const list = document.getElementById('products-list');
      const filtered = getFilteredProducts();

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
      }

      list.innerHTML = filtered.map(p => `
        <div class="product" data-id="${p.id}">
          <img src="${p.photos[0]}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x400?text=No+Photo'">
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString('ru-RU')} ₽</div>
            <button class="add-btn" data-id="${p.id}">В корзину</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.product').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('add-btn')) return;
          openProduct(Number(card.dataset.id));
        });
      });

      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          addToCart(Number(btn.dataset.id));
        });
      });
    }

    function openProduct(id) {
      currentProduct = products.find(p => p.id === id);
      if (!currentProduct) return;
      currentSlide = 0;
      document.getElementById('detail-name').textContent = currentProduct.name;
      document.getElementById('detail-price').textContent = currentProduct.price.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('detail-desc').textContent = currentProduct.description;

      const track = document.getElementById('gallery-track');
      track.innerHTML = currentProduct.photos.map(src => 
        `<img src="${src}" alt="" onerror="this.src='https://via.placeholder.com/400x400?text=No+Photo'">`
      ).join('');
      track.style.transform = 'translateX(0)';

      const dots = document.getElementById('gallery-dots');
      dots.innerHTML = currentProduct.photos.map((_, i) => 
        `<span class="${i === 0 ? 'active' : ''}"></span>`
      ).join('');

      showPage('product-page');
    }

    // Свайп фото
    let startX = 0;
    document.querySelector('.gallery').addEventListener('touchstart', e => startX = e.touches[0].clientX);
    document.querySelector('.gallery').addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 50) {
        if (diff > 0 && currentSlide < currentProduct.photos.length - 1) currentSlide++;
        else if (diff < 0 && currentSlide > 0) currentSlide--;
        updateGallery();
      }
    });

    function updateGallery() {
      document.getElementById('gallery-track').style.transform = `translateX(-${currentSlide * 50}%)`;
      document.querySelectorAll('#gallery-dots span').forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlide);
      });
    }

    document.getElementById('back-btn').addEventListener('click', () => {
      showPage('catalog');
      document.querySelector('.tab[data-page="catalog"]').classList.add('active');
      document.querySelector('.tab[data-page="cart"]').classList.remove('active');
    });

    document.getElementById('detail-add-btn').addEventListener('click', () => {
      if (currentProduct) addToCart(currentProduct.id);
    });

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(item => item.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1, photo: product.photos[0] });
      saveCart();
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      tg.showPopup({
        title: 'Добавлено',
        message: `${product.name} добавлен в корзину`,
        buttons: [{ type: 'ok' }]
      });
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      saveCart();
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalBar = document.getElementById('cart-total');
      if (cart.length === 0) {
        list.innerHTML = '<div class="empty">Корзина пуста</div>';
        totalBar.style.display = 'none';
        return;
      }
      list.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.photo || item.photos?.[0]}" alt="">
          <div class="cart-info">
            <div class="name">${item.name}</div>
            <div class="price">${item.price.toLocaleString('ru-RU')} ₽</div>
          </div>
          <div class="qty">
            <button class="qty-btn" data-id="${item.id}" data-delta="-1">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');
      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => changeQty(Number(btn.dataset.id), Number(btn.dataset.delta)));
      });
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById('total-price').textContent = total.toLocaleString('ru-RU') + ' ₽';
      totalBar.style.display = 'flex';
    }

    function updateCartCount() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cart-count').textContent = count > 0 ? `(${count})` : '';
    }

    async function sendOrderToAdmin() {
      const user = tg.initDataUnsafe?.user;
      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      let message = `🛒 <b>Новый заказ!</b>\n\n`;
      if (user) {
        message += `👤 Покупатель: ${user.first_name || ''} ${user.last_name || ''}\n`;
        if (user.username) message += `Юзернейм: @${user.username}\n`;
        message += `ID: <code>${user.id}</code>\n\n`;
      }
      message += `<b>Товары:</b>\n`;
      cart.forEach(item => {
        message += `• ${item.name} × ${item.qty} = ${(item.price * item.qty).toLocaleString('ru-RU')} ₽\n`;
      });
      message += `\n💰 <b>Итого: ${total.toLocaleString('ru-RU')} ₽</b>\n\n⏰ ${new Date().toLocaleString('ru-RU')}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'HTML' })
        });
        return (await response.json()).ok;
      } catch (e) { return false; }
    }

    document.getElementById('checkout-btn').addEventListener('click', async () => {
      if (cart.length === 0) return;
      const btn = document.getElementById('checkout-btn');
      btn.disabled = true; btn.textContent = 'Отправка...';
      const success = await sendOrderToAdmin();
      btn.disabled = false; btn.textContent = 'Оформить';
      if (success) {
        tg.showPopup({ title: 'Заказ отправлен!', message: 'Информация о заказе отправлена. Мы свяжемся с вами.', buttons: [{ type: 'ok' }] });
        cart = []; saveCart(); renderCart();
      } else {
        tg.showAlert('Не удалось отправить заказ.');
      }
    });

    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
