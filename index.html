<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --border: color-mix(in srgb, var(--hint) 25%, transparent);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 100px;
      line-height: 1.4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--secondary);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(20px);
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .tabs {
      display: flex;
      gap: 6px;
    }

    .tab {
      padding: 8px 14px;
      border-radius: 20px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--button);
      color: var(--button-text);
      border-color: var(--button);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--button) 30%, transparent);
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 16px;
    }

    .product {
      background: var(--secondary);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }

    .product img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #e5e5ea;
    }

    .product-info {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .product-name {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.3;
    }

    .product-price {
      color: var(--button);
      font-weight: 700;
      font-size: 16px;
    }

    .add-btn {
      margin-top: 8px;
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 14px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 14px;
      background: #e5e5ea;
    }

    .cart-info {
      flex: 1;
      min-width: 0;
    }

    .cart-info .name {
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-info .price {
      color: var(--button);
      font-weight: 600;
      font-size: 15px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: var(--button);
      color: white;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty span {
      font-weight: 600;
      font-size: 16px;
      min-width: 20px;
      text-align: center;
    }

    .total-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--secondary);
      padding: 16px;
      display: none;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
      z-index: 50;
      border-top: 1px solid var(--border);
    }

    .total-bar .label {
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 2px;
    }

    .total-bar .amount {
      font-size: 22px;
      font-weight: 700;
    }

    .checkout-btn {
      background: var(--button);
      color: var(--button-text);
      border: none;
      padding: 14px 26px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 90px 24px;
      color: var(--hint);
      font-size: 16px;
      line-height: 1.5;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">Витрина</h1>
    <div class="tabs">
      <button class="tab active" data-page="catalog">Товары</button>
      <button class="tab" data-page="cart">Корзина <span id="cart-count"></span></button>
    </div>
  </header>

  <!-- Витрина -->
  <div id="catalog" class="page active">
    <div class="products" id="products-list"></div>
  </div>

  <!-- Корзина -->
  <div id="cart" class="page">
    <div id="cart-list"></div>
    <div class="total-bar" id="cart-total">
      <div>
        <div class="label">Итого</div>
        <div class="amount" id="total-price">0 ₽</div>
      </div>
      <button class="checkout-btn" id="checkout-btn">Оформить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ===== Товары (всегда из кода) =====
    let products = [
      {
        id: 1,
        name: "Бюст Паук-Нуар",
        price: 8990,
        description: "Коллекционный бюст",
        photo: "https://disk.yandex.ru/i/-unFhkzmvAHkTA"
      },
      {
        id: 2,
        name: "Фигурка Power",
        price: 1990,
        description: "Коллекционная фигурка",
        photo: "https://via.placeholder.com/400x400?text=Power"
      }
    ];

    let cart = JSON.parse(localStorage.getItem('shop_cart') || '[]');

    function saveCart() {
      localStorage.setItem('shop_cart', JSON.stringify(cart));
      updateCartCount();
    }

    // ===== Навигация =====
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const page = btn.dataset.page;
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(page).classList.add('active');

        const titles = {
          catalog: 'Витрина',
          cart: 'Корзина'
        };
        document.getElementById('page-title').textContent = titles[page];

        if (page === 'catalog') renderProducts();
        if (page === 'cart') renderCart();
      });
    });

    // ===== Витрина =====
    function renderProducts() {
      const list = document.getElementById('products-list');

      list.innerHTML = products.map(p => `
        <div class="product">
          <img src="${p.photo}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x400?text=No+Photo'">
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString('ru-RU')} ₽</div>
            <button class="add-btn" data-id="${p.id}">В корзину</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          addToCart(Number(btn.dataset.id));
        });
      });
    }

    // ===== Корзина =====
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      saveCart();
      
      if (tg.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      tg.showPopup({
        title: 'Добавлено',
        message: `${product.name} добавлен в корзину`,
        buttons: [{ type: 'ok' }]
      });
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }

      saveCart();
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalBar = document.getElementById('cart-total');

      if (cart.length === 0) {
        list.innerHTML = '<div class="empty">Корзина пуста</div>';
        totalBar.style.display = 'none';
        return;
      }

      list.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.photo}" alt="">
          <div class="cart-info">
            <div class="name">${item.name}</div>
            <div class="price">${item.price.toLocaleString('ru-RU')} ₽</div>
          </div>
          <div class="qty">
            <button class="qty-btn" data-id="${item.id}" data-delta="-1">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          changeQty(Number(btn.dataset.id), Number(btn.dataset.delta));
        });
      });

      const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById('total-price').textContent = total.toLocaleString('ru-RU') + ' ₽';
      totalBar.style.display = 'flex';
    }

    function updateCartCount() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cart-count').textContent = count > 0 ? `(${count})` : '';
    }

    // Оформление заказа
    document.getElementById('checkout-btn').addEventListener('click', () => {
      if (cart.length === 0) return;

      const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

      tg.showPopup({
        title: 'Заказ оформлен!',
        message: `Сумма: ${total.toLocaleString('ru-RU')} ₽\nМы свяжемся с вами в ближайшее время.`,
        buttons: [{ type: 'ok' }]
      });

      cart = [];
      saveCart();
      renderCart();
    });

    // ===== Запуск =====
    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
