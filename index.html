<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Магазин</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8e8e93);
      --button: var(--tg-theme-button-color, #007aff);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
      --border: color-mix(in srgb, var(--hint) 25%, transparent);
    }
    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 130px;
      line-height: 1.4;
    }
    img { -webkit-user-drag: none; user-drag: none; display: block; }
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--secondary);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .tabs { display: flex; gap: 6px; }
    .tab {
      padding: 8px 14px; border-radius: 20px;
      background: transparent; border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .tab.active {
      background: var(--button); color: var(--button-text); border-color: var(--button);
    }
    .filters { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
    .search-box {
      width: 100%; padding: 12px 16px; border-radius: 14px;
      border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 15px; outline: none;
    }
    .categories { display: flex; gap: 8px; overflow-x: auto; }
    .cat-btn {
      padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 13px;
      font-weight: 500; white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active {
      background: var(--button); color: var(--button-text); border-color: var(--button);
    }
    .products {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 14px; padding: 0 16px 16px;
    }
    .product {
      background: var(--secondary); border-radius: 18px;
      overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
    }
    .product-img-wrap {
      width: 100%; height: 150px; background: #d1d1d6; overflow: hidden;
    }
    .product-img-wrap img {
      width: 100%; height: 150px; object-fit: cover;
    }
    .product-info { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .product-name { font-weight: 600; font-size: 14px; }
    .product-price { color: var(--button); font-weight: 700; font-size: 16px; }
    .add-btn {
      margin-top: 8px; background: var(--button); color: var(--button-text);
      border: none; padding: 11px; border-radius: 12px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .gallery {
      position: relative; width: 100%; height: 320px;
      overflow: hidden; background: #d1d1d6;
    }
    .gallery-track {
      display: flex; height: 100%; transition: transform 0.3s ease;
    }
    .gallery-slide { min-width: 100%; height: 100%; }
    .gallery-slide img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .gallery-dots {
      position: absolute; bottom: 12px; left: 0; right: 0;
      display: flex; justify-content: center; gap: 6px;
    }
    .gallery-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.5);
    }
    .gallery-dots span.active { background: white; }
    .detail-content { padding: 20px 16px; }
    .detail-name { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--button); margin-bottom: 16px; }
    .detail-desc { font-size: 15px; line-height: 1.5; margin-bottom: 24px; white-space: pre-wrap; }
    .detail-actions { display: flex; gap: 10px; }
    .back-btn {
      flex: 1; padding: 14px; border-radius: 14px; border: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .detail-add-btn {
      flex: 2; padding: 14px; border-radius: 14px; border: none;
      background: var(--button); color: var(--button-text); font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .cart-item {
      display: flex; gap: 14px; padding: 16px;
      border-bottom: 1px solid var(--border); align-items: center;
    }
    .cart-item img {
      width: 70px; height: 70px; object-fit: cover; border-radius: 14px; background: #d1d1d6;
    }
    .cart-info { flex: 1; min-width: 0; }
    .cart-info .name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .cart-info .price { color: var(--button); font-weight: 600; }
    .qty { display: flex; align-items: center; gap: 12px; }
    .qty button {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: var(--button); color: white; font-size: 18px; cursor: pointer;
    }
    .delivery-block { padding: 16px; border-top: 1px solid var(--border); }
    .delivery-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
    .delivery-option {
      display: flex; align-items: center; gap: 12px;
      padding: 14px; border-radius: 14px; border: 1.5px solid var(--border);
      margin-bottom: 10px; cursor: pointer;
    }
    .delivery-option.active {
      border-color: var(--button);
      background: color-mix(in srgb, var(--button) 8%, transparent);
    }
    .delivery-option input { accent-color: var(--button); width: 18px; height: 18px; }
    .delivery-option .text { flex: 1; font-size: 14px; }
    .delivery-option .price-tag { font-weight: 600; color: var(--button); font-size: 14px; }

    .ozon-fields {
      margin-top: 14px; display: none; flex-direction: column; gap: 12px;
    }
    .ozon-fields.show { display: flex; }
    .ozon-fields .note {
      font-size: 13px; color: var(--hint); line-height: 1.45;
      background: color-mix(in srgb, var(--button) 8%, transparent);
      padding: 12px 14px; border-radius: 12px;
    }
    .ozon-fields input {
      width: 100%; padding: 14px; border-radius: 12px;
      border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 15px; outline: none;
    }
    .ozon-fields input:focus { border-color: var(--button); }

    .map-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #fc3f1d, #ff6b4a);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(252, 63, 29, 0.35);
    }
    .map-btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
    .map-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .total-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--secondary); padding: 16px;
      display: none; justify-content: space-between; align-items: center;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.08); z-index: 50;
      border-top: 1px solid var(--border);
    }
    .total-bar .label { font-size: 13px; color: var(--hint); }
    .total-bar .amount { font-size: 22px; font-weight: 700; }
    .checkout-btn {
      background: var(--button); color: var(--button-text);
      border: none; padding: 14px 26px; border-radius: 14px;
      font-weight: 600; font-size: 15px; cursor: pointer;
    }
    .checkout-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .empty { text-align: center; padding: 90px 24px; color: var(--hint); font-size: 16px; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

  <header>
    <h1 id="page-title">Витрина</h1>
    <div class="tabs" id="main-tabs">
      <button class="tab active" data-page="catalog">Товары</button>
      <button class="tab" data-page="cart">Корзина <span id="cart-count"></span></button>
    </div>
  </header>

  <div id="catalog" class="page active">
    <div class="filters">
      <input type="text" class="search-box" id="search-input" placeholder="Поиск по названию...">
      <div class="categories">
        <button class="cat-btn active" data-category="all">Все</button>
        <button class="cat-btn" data-category="busts">Бюсты</button>
        <button class="cat-btn" data-category="figures">Фигурки</button>
      </div>
    </div>
    <div class="products" id="products-list"></div>
  </div>

  <div id="product-page" class="page">
    <div class="product-detail">
      <div class="gallery">
        <div class="gallery-track" id="gallery-track"></div>
        <div class="gallery-dots" id="gallery-dots"></div>
      </div>
      <div class="detail-content">
        <div class="detail-name" id="detail-name"></div>
        <div class="detail-price" id="detail-price"></div>
        <div class="detail-desc" id="detail-desc"></div>
        <div class="detail-actions">
          <button class="back-btn" id="back-btn">← Назад</button>
          <button class="detail-add-btn" id="detail-add-btn">В корзину</button>
        </div>
      </div>
    </div>
  </div>

  <div id="cart" class="page">
    <div id="cart-list"></div>

    <div class="delivery-block" id="delivery-block" style="display:none;">
      <div class="delivery-title">Способ получения</div>

      <label class="delivery-option" id="opt-ozon">
        <input type="radio" name="delivery" value="ozon">
        <div class="text">Доставка до пункта Ozon</div>
        <div class="price-tag">+500 ₽</div>
      </label>

      <label class="delivery-option" id="opt-pickup">
        <input type="radio" name="delivery" value="pickup">
        <div class="text">Самовывоз</div>
        <div class="price-tag">Бесплатно</div>
      </label>

      <div class="ozon-fields" id="ozon-fields">
        <div class="note">
          Обязательная информация для оформления заказа на Ozon.<br>
          Найдите пункт на карте, скопируйте адрес и вставьте ниже.
        </div>

        <button class="map-btn" id="open-map-btn" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          Найти пункт на карте
        </button>

        <input type="text" id="recipient-name" placeholder="Имя получателя *">
        <input type="tel" id="recipient-phone" placeholder="Номер телефона *">
        <input type="text" id="ozon-address" placeholder="Адрес пункта выдачи Ozon *">
      </div>
    </div>

    <div class="total-bar" id="cart-total">
      <div>
        <div class="label">Итого</div>
        <div class="amount" id="total-price">0 ₽</div>
      </div>
      <button class="checkout-btn" id="checkout-btn" disabled>Оформить</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

    const BOT_TOKEN = '8591437038:AAG8PFhkCNZcMgmUycYGWALAjpAmhA65pqY';
    const ADMIN_CHAT_ID = '1232069518';
    const SUPPORT_LINK = 'https://t.me/MagazinFigurokAnime';
    const DELIVERY_PRICE = 500;

    const POWER1 = "https://raw.githubusercontent.com/Planavou/OniStoreBot/main/4c50d28f72b348eaa09540777c16316a_bananalab-pro_1K.jpg";
    const POWER2 = "https://raw.githubusercontent.com/Planavou/OniStoreBot/main/f4638ee1813e456a99d414dbf90987b1_bananalab-pro_1K.jpg";
    const POWER_GIF = "https://i.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif";

    const PH1 = "https://via.placeholder.com/400x400/2c2c2e/ffffff?text=Photo+1";
    const PH2 = "https://via.placeholder.com/400x400/3a3a3c/ffffff?text=Photo+2";
    const PH3 = "https://via.placeholder.com/400x400/48484a/ffffff?text=Photo+3";

    let products = [
      {
        id: 1, name: "Бюст Паук-Нуар", price: 1, category: "busts",
        description: "Коллекционный бюст Паук-Нуар.\nВысокое качество исполнения.\nОтличный подарок для фанатов.",
        photos: [PH1, PH2, PH3]
      },
      {
        id: 3, name: "Бюст Венома", price: 1, category: "busts",
        description: "Детализированный бюст Венома.\nМатериал: полистоун.\nВысота ≈ 15 см.",
        photos: [PH2, PH3, PH1]
      },
      {
        id: 4, name: "Бюст Дэдпула", price: 1, category: "busts",
        description: "Бюст Дэдпула в классическом стиле.\nЯркая раскраска, отличная детализация.",
        photos: [PH3, PH1, PH2]
      },
      {
        id: 2, name: "Фигурка Power", price: 1, category: "figures",
        description: "Коллекционная фигурка Power.\nДетализированная проработка.\nМатериал: ПВХ.",
        photos: [POWER1, POWER2, POWER_GIF]
      },
      {
        id: 5, name: "Фигурка Наруто", price: 1, category: "figures",
        description: "Фигурка Наруто в позе боя.\nВысота ≈ 18 см.\nПодвижные элементы.",
        photos: [PH1, PH2, PH3]
      },
      {
        id: 6, name: "Фигурка Гоку", price: 1, category: "figures",
        description: "Супер Сайян Гоку.\nДинамичная поза.\nКачественная прокраска.",
        photos: [PH2, PH1, PH3]
      },
      {
        id: 7, name: "Фигурка Леви", price: 1, category: "figures",
        description: "Леви Аккерман из Атаки Титанов.\nОтличное качество скульптуры.",
        photos: [PH3, PH2, PH1]
      }
    ];

    let cart = JSON.parse(localStorage.getItem('shop_cart') || '[]');
    let currentProduct = null;
    let currentSlide = 0;
    let currentCategory = 'all';
    let searchQuery = '';
    let deliveryMethod = null;

    function saveCart() {
      localStorage.setItem('shop_cart', JSON.stringify(cart));
      updateCartCount();
    }

    function generateOrderNumber() {
      return Math.floor(100000 + Math.random() * 900000);
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      const titles = { catalog: 'Витрина', cart: 'Корзина', 'product-page': 'Товар' };
      document.getElementById('page-title').textContent = titles[pageId] || 'Магазин';
      document.getElementById('main-tabs').style.display = pageId === 'product-page' ? 'none' : 'flex';
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showPage(btn.dataset.page);
        if (btn.dataset.page === 'catalog') renderProducts();
        if (btn.dataset.page === 'cart') renderCart();
      });
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderProducts();
      });
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      renderProducts();
    });

    function getFilteredProducts() {
      return products.filter(p => {
        const matchCategory = currentCategory === 'all' || p.category === currentCategory;
        const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery);
        return matchCategory && matchSearch;
      });
    }

    function renderProducts() {
      const list = document.getElementById('products-list');
      const filtered = getFilteredProducts();
      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
      }

      list.innerHTML = filtered.map(p => `
        <div class="product" data-id="${p.id}">
          <div class="product-img-wrap">
            <img src="${p.photos[0]}" alt="">
          </div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-price">${p.price.toLocaleString('ru-RU')} ₽</div>
            <button class="add-btn" data-id="${p.id}">В корзину</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.product').forEach(card => {
        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('add-btn')) return;
          openProduct(Number(card.dataset.id));
        });
      });
      document.querySelectorAll('.add-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          addToCart(Number(btn.dataset.id));
        });
      });
    }

    function openProduct(id) {
      currentProduct = products.find(p => p.id === id);
      if (!currentProduct) return;
      currentSlide = 0;

      document.getElementById('detail-name').textContent = currentProduct.name;
      document.getElementById('detail-price').textContent = currentProduct.price.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('detail-desc').textContent = currentProduct.description;

      const track = document.getElementById('gallery-track');
      track.innerHTML = currentProduct.photos.map(src => 
        `<div class="gallery-slide"><img src="${src}" alt=""></div>`
      ).join('');
      track.style.transform = 'translateX(0)';

      const dots = document.getElementById('gallery-dots');
      dots.innerHTML = currentProduct.photos.map((_, i) => 
        `<span class="${i === 0 ? 'active' : ''}"></span>`
      ).join('');

      showPage('product-page');
    }

    let startX = 0;
    document.querySelector('.gallery').addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
    }, { passive: true });

    document.querySelector('.gallery').addEventListener('touchend', e => {
      if (!currentProduct) return;
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) {
        if (diff > 0 && currentSlide < currentProduct.photos.length - 1) currentSlide++;
        else if (diff < 0 && currentSlide > 0) currentSlide--;
        document.getElementById('gallery-track').style.transform = `translateX(-${currentSlide * 100}%)`;
        document.querySelectorAll('#gallery-dots span').forEach((dot, i) => {
          dot.classList.toggle('active', i === currentSlide);
        });
      }
    }, { passive: true });

    document.getElementById('back-btn').addEventListener('click', () => {
      showPage('catalog');
      document.querySelector('.tab[data-page="catalog"]').classList.add('active');
      document.querySelector('.tab[data-page="cart"]').classList.remove('active');
    });

    document.getElementById('detail-add-btn').addEventListener('click', () => {
      if (currentProduct) addToCart(currentProduct.id);
    });

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      const existing = cart.find(item => item.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ 
        id: product.id, 
        name: product.name, 
        price: product.price, 
        qty: 1, 
        photo: product.photos[0]
      });
      saveCart();
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      tg.showPopup({ title: 'Добавлено', message: product.name + ' добавлен в корзину', buttons: [{ type: 'ok' }] });
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
      saveCart();
      renderCart();
    }

    function updateDeliveryUI() {
      document.querySelectorAll('.delivery-option').forEach(el => el.classList.remove('active'));
      const fields = document.getElementById('ozon-fields');
      if (deliveryMethod === 'ozon') {
        document.getElementById('opt-ozon').classList.add('active');
        fields.classList.add('show');
      } else if (deliveryMethod === 'pickup') {
        document.getElementById('opt-pickup').classList.add('active');
        fields.classList.remove('show');
      }
      updateTotal();
      checkCheckoutReady();
    }

    document.getElementById('opt-ozon').addEventListener('click', () => {
      deliveryMethod = 'ozon';
      document.querySelector('input[value="ozon"]').checked = true;
      updateDeliveryUI();
    });
    document.getElementById('opt-pickup').addEventListener('click', () => {
      deliveryMethod = 'pickup';
      document.querySelector('input[value="pickup"]').checked = true;
      updateDeliveryUI();
    });

    // Исправленная кнопка карты (веб-версия, без intent://)
    document.getElementById('open-map-btn').addEventListener('click', () => {
      const url = 'https://yandex.ru/maps/?text=' + encodeURIComponent('пункт выдачи Ozon');

      if (window.Telegram && Telegram.WebApp && Telegram.WebApp.openLink) {
        Telegram.WebApp.openLink(url);
      } else {
        window.open(url, '_blank');
      }
    });

    ['recipient-name', 'recipient-phone', 'ozon-address'].forEach(id => {
      document.getElementById(id).addEventListener('input', checkCheckoutReady);
    });

    function checkCheckoutReady() {
      const btn = document.getElementById('checkout-btn');
      if (!deliveryMethod) { btn.disabled = true; return; }
      if (deliveryMethod === 'ozon') {
        const name = document.getElementById('recipient-name').value.trim();
        const phone = document.getElementById('recipient-phone').value.trim();
        const address = document.getElementById('ozon-address').value.trim();
        btn.disabled = !(name.length >= 2 && phone.length >= 10 && address.length >= 5);
      } else {
        btn.disabled = false;
      }
    }

    function getDeliveryPrice() {
      return deliveryMethod === 'ozon' ? DELIVERY_PRICE : 0;
    }

    function updateTotal() {
      const productsTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      document.getElementById('total-price').textContent = (productsTotal + getDeliveryPrice()).toLocaleString('ru-RU') + ' ₽';
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      const totalBar = document.getElementById('cart-total');
      const deliveryBlock = document.getElementById('delivery-block');

      if (cart.length === 0) {
        list.innerHTML = '<div class="empty">Корзина пуста</div>';
        totalBar.style.display = 'none';
        deliveryBlock.style.display = 'none';
        return;
      }

      list.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.photo}" alt="">
          <div class="cart-info">
            <div class="name">${item.name}</div>
            <div class="price">${item.price.toLocaleString('ru-RU')} ₽</div>
          </div>
          <div class="qty">
            <button class="qty-btn" data-id="${item.id}" data-delta="-1">−</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-delta="1">+</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => changeQty(Number(btn.dataset.id), Number(btn.dataset.delta)));
      });

      deliveryBlock.style.display = 'block';
      totalBar.style.display = 'flex';
      updateTotal();
      checkCheckoutReady();
    }

    function updateCartCount() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cart-count').textContent = count > 0 ? `(${count})` : '';
    }

    async function sendMessage(chatId, text) {
      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'HTML' })
        });
        return (await response.json()).ok;
      } catch (e) { return false; }
    }

    async function processOrder() {
      const user = tg.initDataUnsafe?.user;
      const productsTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
      const delivery = getDeliveryPrice();
      const total = productsTotal + delivery;
      const orderNumber = generateOrderNumber();
      const name = document.getElementById('recipient-name').value.trim();
      const phone = document.getElementById('recipient-phone').value.trim();
      const address = document.getElementById('ozon-address').value.trim();

      let adminMsg = `🛒 <b>Новый заказ №${orderNumber}</b>\n\n`;
      if (user) {
        adminMsg += `👤 Покупатель: ${user.first_name || ''} ${user.last_name || ''}\n`;
        if (user.username) adminMsg += `Юзернейм: @${user.username}\n`;
        adminMsg += `ID: <code>${user.id}</code>\n\n`;
      }
      adminMsg += `<b>Товары:</b>\n`;
      cart.forEach(item => {
        adminMsg += `• ${item.name} × ${item.qty} = ${(item.price * item.qty).toLocaleString('ru-RU')} ₽\n`;
      });
      adminMsg += `\n📦 <b>Доставка:</b> ${deliveryMethod === 'ozon' ? 'Ozon (+500 ₽)' : 'Самовывоз'}`;
      if (deliveryMethod === 'ozon') {
        adminMsg += `\n👤 Получатель: ${name}`;
        adminMsg += `\n📞 Телефон: ${phone}`;
        adminMsg += `\n📍 Адрес пункта: ${address}`;
      }
      adminMsg += `\n\n💰 <b>Итого: ${total.toLocaleString('ru-RU')} ₽</b>`;
      adminMsg += `\n\n⏰ ${new Date().toLocaleString('ru-RU')}`;

      let clientMsg = `✅ <b>Ваш заказ №${orderNumber} принят!</b>\n\n`;
      clientMsg += `<b>Состав заказа:</b>\n`;
      cart.forEach(item => {
        clientMsg += `• ${item.name} × ${item.qty} = ${(item.price * item.qty).toLocaleString('ru-RU')} ₽\n`;
      });
      clientMsg += `\n📦 Доставка: ${deliveryMethod === 'ozon' ? 'до пункта Ozon (+500 ₽)' : 'Самовывоз'}`;
      if (deliveryMethod === 'ozon') {
        clientMsg += `\n👤 Получатель: ${name}\n📞 Телефон: ${phone}\n📍 Пункт: ${address}`;
      }
      clientMsg += `\n\n💰 <b>Итого: ${total.toLocaleString('ru-RU')} ₽</b>\n\n`;
      clientMsg += `Мы скоро свяжемся с вами для оплаты.\n\nЕсли возникнут вопросы — пишите сюда:\n${SUPPORT_LINK}`;

      const adminOk = await sendMessage(ADMIN_CHAT_ID, adminMsg);
      if (user?.id) await sendMessage(user.id, clientMsg);
      return { adminOk, orderNumber };
    }

    document.getElementById('checkout-btn').addEventListener('click', async () => {
      if (cart.length === 0 || !deliveryMethod) return;
      if (deliveryMethod === 'ozon') {
        const name = document.getElementById('recipient-name').value.trim();
        const phone = document.getElementById('recipient-phone').value.trim();
        const address = document.getElementById('ozon-address').value.trim();
        if (name.length < 2 || phone.length < 10 || address.length < 5) {
          tg.showAlert('Заполните все обязательные поля');
          return;
        }
      }

      const btn = document.getElementById('checkout-btn');
      btn.disabled = true;
      btn.textContent = 'Отправка...';
      const result = await processOrder();
      btn.disabled = false;
      btn.textContent = 'Оформить';

      if (result.adminOk) {
        tg.showPopup({
          title: 'Заказ оформлен!',
          message: `Номер заказа: ${result.orderNumber}\n\nМы свяжемся с вами для оплаты.`,
          buttons: [{ type: 'ok' }]
        });
        cart = [];
        deliveryMethod = null;
        document.getElementById('recipient-name').value = '';
        document.getElementById('recipient-phone').value = '';
        document.getElementById('ozon-address').value = '';
        document.querySelectorAll('input[name="delivery"]').forEach(r => r.checked = false);
        document.getElementById('ozon-fields').classList.remove('show');
        saveCart();
        renderCart();
      } else {
        tg.showAlert('Не удалось оформить заказ.');
      }
    });

    renderProducts();
    updateCartCount();
  </script>
</body>
</html>
